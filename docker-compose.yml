version: '3.9'

services:
  # --- TU SERVIDOR NESTJS ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest_api
    restart: always
    ports:
      - "3001:3000" # Mapea el puerto 3001 del host al 3000 del contenedor
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: [ "npm", "run", "start:dev" ]
    environment:
      DATABASE_URL: postgres://username:password@database:5432/databasename
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    depends_on:
      - database
      - redis

  # --- TUS SERVICIOS EXISTENTES ---
  database:
    container_name: postgres
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: databasename
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    container_name: redis_testqueues
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  test-database:
    container_name: test-postgres
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: test-databasename
      POSTGRES_USER: test-username
      POSTGRES_PASSWORD: test-password
    ports:
      - "5433:5432"
    volumes:
      - test-pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  redisdata:
  test-pgdata:
